<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Объяснение исправлений</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--tg-theme-hint-color, #999999);
        }
        
        .header h1 {
            font-size: 24px;
            color: var(--tg-theme-text-color, #000000);
            margin-bottom: 5px;
        }
        
        .content {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .explanation {
            font-size: 16px;
            line-height: 1.8;
            color: var(--tg-theme-text-color, #000000);
        }
        
        .explanation strong {
            color: var(--tg-theme-button-color, #3390ec);
            font-weight: 600;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--tg-theme-hint-color, #999999);
        }
        
        .error {
            text-align: center;
            padding: 40px;
            color: #ff3333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💡 Объяснение исправлений</h1>
        </div>
        <div id="content" class="content">
            <div class="loading">Загрузка...</div>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Получаем данные из initData
        function getInitData() {
            const initData = tg.initDataUnsafe;
            return initData;
        }

        // Получаем объяснение из параметров запуска
        function getExplanation() {
            const initData = getInitData();
            // Объяснение передается через start_param или можно получить через backend
            // Для простоты используем localStorage или передаем через URL параметры
            const urlParams = new URLSearchParams(window.location.search);
            const explanation = urlParams.get('explanation');
            
            if (explanation) {
                return decodeURIComponent(explanation);
            }
            
            // Альтернативный способ - через localStorage (если данные передаются через бота)
            const stored = localStorage.getItem('explanation');
            if (stored) {
                localStorage.removeItem('explanation');
                return stored;
            }
            
            return null;
        }

        // Отображаем объяснение
        function displayExplanation(text) {
            const contentDiv = document.getElementById('content');
            
            if (!text) {
                contentDiv.innerHTML = '<div class="error">Объяснение не найдено</div>';
                return;
            }
            
            // Простая обработка markdown-подобного форматирования
            let formatted = text
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/###+\s*/g, '')
                .replace(/\n/g, '<br>');
            
            contentDiv.innerHTML = `<div class="explanation">${formatted}</div>`;
        }

        // Загружаем объяснение при загрузке страницы
        window.addEventListener('DOMContentLoaded', () => {
            const explanation = getExplanation();
            displayExplanation(explanation);
        });

        // Обработка сообщений от бота (если используется postMessage)
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'explanation') {
                displayExplanation(event.data.text);
            }
        });
    </script>
</body>
</html>
