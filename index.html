<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Объяснение исправлений</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--tg-theme-hint-color, #999999);
        }
        
        .header h1 {
            font-size: 24px;
            color: var(--tg-theme-text-color, #000000);
            margin-bottom: 5px;
        }
        
        .content {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .explanation {
            font-size: 16px;
            line-height: 1.8;
            color: var(--tg-theme-text-color, #000000);
        }
        
        .explanation strong {
            color: var(--tg-theme-button-color, #3390ec);
            font-weight: 600;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--tg-theme-hint-color, #999999);
        }
        
        .error {
            text-align: center;
            padding: 40px;
            color: #ff3333;
        }
        
        .translate-button {
            margin-top: 20px;
            padding: 12px 24px;
            background: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        
        .translate-button:hover {
            opacity: 0.9;
        }
        
        .translate-button:active {
            opacity: 0.8;
        }
        
        .translate-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .translation {
            margin-top: 20px;
            padding: 15px;
            background: var(--tg-theme-bg-color, #ffffff);
            border-left: 4px solid var(--tg-theme-button-color, #3390ec);
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.8;
        }
        
        .translation-label {
            font-weight: 600;
            color: var(--tg-theme-button-color, #3390ec);
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="header-title">Загрузка...</h1>
        </div>
        <div id="content" class="content">
            <div class="loading">Загрузка...</div>
        </div>
        <div id="translation-container" style="display: none;"></div>
        <div id="logs-container" style="display: none; margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 8px; font-size: 12px; max-height: 200px; overflow-y: auto;">
            <div style="font-weight: 600; margin-bottom: 10px; color: #666;">📋 Логи:</div>
            <div id="logs-content" style="font-family: monospace; white-space: pre-wrap; word-break: break-all;"></div>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        // Функция для добавления логов в интерфейс
        function addLog(message, type = 'info') {
            const logsContainer = document.getElementById('logs-container');
            const logsContent = document.getElementById('logs-content');
            
            if (!logsContainer || !logsContent) return;
            
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${type.toUpperCase()}: ${message}\n`;
            
            logsContent.textContent += logEntry;
            logsContainer.style.display = 'block';
            logsContainer.scrollTop = logsContainer.scrollHeight;
            
            // Также логируем в консоль
            if (type === 'error') {
                console.error(message);
            } else {
                console.log(message);
            }
        }
        
        // Переопределяем console.log для отображения в интерфейсе
        const originalConsoleLog = console.log;
        const originalConsoleError = console.error;
        
        console.log = function(...args) {
            originalConsoleLog.apply(console, args);
            addLog(args.join(' '), 'info');
        };
        
        console.error = function(...args) {
            originalConsoleError.apply(console, args);
            addLog(args.join(' '), 'error');
        };

        // Получаем данные из initData
        function getInitData() {
            const initData = tg.initDataUnsafe;
            return initData;
        }

        // Получаем данные из параметров запуска
        function getData() {
            const urlParams = new URLSearchParams(window.location.search);
            const type = urlParams.get('type'); // 'explanation', 'text', 'hints'
            const data = urlParams.get('data');
            
            return {
                type: type || 'explanation',
                content: data ? decodeURIComponent(data) : null
            };
        }

        // Отображаем контент
        function displayContent(type, text) {
            const contentDiv = document.getElementById('content');
            const headerTitle = document.getElementById('header-title');
            const translationContainer = document.getElementById('translation-container');
            
            // Устанавливаем заголовок в зависимости от типа
            switch(type) {
                case 'explanation':
                    headerTitle.textContent = '💡 Объяснение исправлений';
                    break;
                case 'text':
                    headerTitle.textContent = '💬 Мой ответ';
                    break;
                case 'hints':
                    headerTitle.textContent = '💡 Подсказки для ответа';
                    break;
                default:
                    headerTitle.textContent = 'Информация';
            }
            
            if (!text) {
                contentDiv.innerHTML = '<div class="error">Контент не найден</div>';
                return;
            }
            
            // Простая обработка markdown-подобного форматирования
            let formatted = text
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/###+\s*/g, '')
                .replace(/\n/g, '<br>');
            
            let contentHTML = `<div class="explanation">${formatted}</div>`;
            
            // Добавляем кнопку "Перевести" только для типа "text"
            if (type === 'text') {
                // Экранируем текст для безопасной передачи в onclick
                const safeText = text.replace(/'/g, "\\'").replace(/\n/g, ' ');
                contentHTML += `<button class="translate-button" onclick="translateText('${encodeURIComponent(safeText)}')">🌐 Перевести</button>`;
            }
            
            contentDiv.innerHTML = contentHTML;
            translationContainer.style.display = 'none';
            translationContainer.innerHTML = '';
        }
        
        // Функция перевода текста
        async function translateText(text) {
            addLog('=== НАЧАЛО ПЕРЕВОДА ===', 'info');
            addLog('Получен текст для перевода (первые 50 символов): ' + text.substring(0, 50), 'info');
            
            const button = document.querySelector('.translate-button');
            const translationContainer = document.getElementById('translation-container');
            
            if (!button) {
                addLog('ОШИБКА: Кнопка не найдена!', 'error');
                return;
            }
            
            addLog('Кнопка найдена', 'info');
            
            const decodedText = decodeURIComponent(text);
            addLog('Декодированный текст (первые 50 символов): ' + decodedText.substring(0, 50), 'info');
            
            // Если перевод уже показан, скрываем его
            if (translationContainer.style.display === 'block' && translationContainer.innerHTML && !translationContainer.innerHTML.includes('Перевожу')) {
                addLog('Скрываю перевод', 'info');
                translationContainer.style.display = 'none';
                translationContainer.innerHTML = '';
                button.textContent = '🌐 Перевести';
                return;
            }
            
            addLog('Отключаю кнопку и показываю загрузку', 'info');
            button.disabled = true;
            button.textContent = 'Перевожу...';
            
            // Показываем индикатор загрузки
            translationContainer.style.display = 'block';
            translationContainer.innerHTML = '<div class="loading">Перевожу...</div>';
            
            try {
                addLog('Проверяю Telegram WebApp объект...', 'info');
                addLog('tg.sendData тип: ' + typeof tg.sendData, 'info');
                addLog('tg.version: ' + (tg.version || 'неизвестно'), 'info');
                addLog('Доступные методы tg: ' + Object.keys(tg).slice(0, 10).join(', ') + '...', 'info');
                
                // Проверяем, что sendData доступен
                if (typeof tg.sendData !== 'function') {
                    const errorMsg = 'sendData не доступен! Доступные методы: ' + Object.keys(tg).join(', ');
                    addLog(errorMsg, 'error');
                    throw new Error(errorMsg);
                }
                
                addLog('sendData доступен ✓', 'info');
                
                // Отправляем запрос на перевод через Telegram WebApp API
                const dataToSend = {
                    type: 'translate',
                    text: decodedText
                };
                
                addLog('Данные для отправки подготовлены', 'info');
                
                const dataString = JSON.stringify(dataToSend);
                addLog('JSON строка создана, длина: ' + dataString.length + ' символов', 'info');
                
                // Показываем информацию пользователю
                translationContainer.innerHTML = '<div class="loading">Отправляю запрос боту...</div>';
                
                addLog('Вызываю tg.sendData...', 'info');
                tg.sendData(dataString);
                addLog('tg.sendData вызван ✓', 'info');
                
                // Показываем уведомление
                try {
                    tg.showAlert('Запрос на перевод отправлен боту!');
                    addLog('Уведомление показано ✓', 'info');
                } catch (alertError) {
                    addLog('Не удалось показать уведомление: ' + alertError.message, 'error');
                }
                
                // Показываем информацию пользователю
                translationContainer.innerHTML = '<div class="translation"><div class="translation-label">Перевод:</div><div>✅ Запрос отправлен боту!<br>Перевод будет отправлен в чат. Проверьте сообщения от бота.</div></div>';
                
                button.disabled = false;
                button.textContent = '🌐 Скрыть';
                
                addLog('=== ПЕРЕВОД ЗАВЕРШЕН (ожидание ответа от бота) ===', 'info');
                
            } catch (error) {
                addLog('=== ОШИБКА ПРИ ПЕРЕВОДЕ ===', 'error');
                addLog('Тип ошибки: ' + error.constructor.name, 'error');
                addLog('Сообщение: ' + error.message, 'error');
                if (error.stack) {
                    addLog('Стек: ' + error.stack.substring(0, 200), 'error');
                }
                
                translationContainer.innerHTML = '<div class="error">❌ Ошибка при переводе:<br>' + error.message + '<br><br>Проверьте логи ниже.</div>';
                button.disabled = false;
                button.textContent = '🌐 Перевести';
            }
        }
        
        // Обработка данных от бота
        tg.onEvent('mainButtonClicked', () => {
            const data = getData();
            if (data.type === 'text' && data.content) {
                translateText(data.content);
            }
        });

        // Загружаем данные при загрузке страницы
        window.addEventListener('DOMContentLoaded', () => {
            addLog('=== ЗАГРУЗКА WEBAPP ===', 'info');
            addLog('Telegram WebApp версия: ' + (tg.version || 'неизвестно'), 'info');
            addLog('Платформа: ' + (tg.platform || 'неизвестно'), 'info');
            addLog('sendData доступен: ' + (typeof tg.sendData === 'function' ? 'да' : 'нет'), 'info');
            
            const { type, content } = getData();
            addLog('Тип контента: ' + type, 'info');
            addLog('Длина контента: ' + (content ? content.length : 0) + ' символов', 'info');
            
            displayContent(type, content);
            addLog('Контент отображен', 'info');
        });
        
        // Логируем все события WebApp
        tg.onEvent('viewportChanged', () => {
            console.log('Viewport changed');
        });
        
        tg.onEvent('themeChanged', () => {
            console.log('Theme changed');
        });
        
        tg.onEvent('mainButtonClicked', () => {
            console.log('Main button clicked');
        });

        // Обработка сообщений от бота (если используется postMessage)
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'explanation') {
                displayExplanation(event.data.text);
            }
        });
    </script>
</body>
</html>
